name: Update market history
run-name: Market history (${{ github.event_name == 'schedule' && 'all regions' || 'selected regions' }})

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      eu:
        description: Update EU
        type: boolean
        default: true
      ru:
        description: Update RU
        type: boolean
        default: true
      na:
        description: Update NA
        type: boolean
        default: true
      sea:
        description: Update SEA
        type: boolean
        default: true
      nea:
        description: Update NEA
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: market-history-api
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_regions: ${{ steps.regions.outputs.has_regions }}
      regions: ${{ steps.regions.outputs.regions }}
    steps:
      - name: Build selected-region matrix
        id: regions
        env:
          SELECT_EU: ${{ github.event_name == 'schedule' || inputs.eu }}
          SELECT_RU: ${{ github.event_name == 'schedule' || inputs.ru }}
          SELECT_NA: ${{ github.event_name == 'schedule' || inputs.na }}
          SELECT_SEA: ${{ github.event_name == 'schedule' || inputs.sea }}
          SELECT_NEA: ${{ github.event_name == 'schedule' || inputs.nea }}
        run: |
          node -e '
            const fs = require("node:fs");
            const regions = ["eu", "ru", "na", "sea", "nea"].filter(
              region => process.env[`SELECT_${region.toUpperCase()}`] === "true",
            );
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `regions=${JSON.stringify(regions)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_regions=${regions.length > 0}\n`);
          '

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify collector
        run: npm test && npm run docs:check

  collect:
    needs: [plan, verify]
    if: needs.plan.outputs.has_regions == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      MARKET_REGION: ${{ matrix.region }}
      MARKET_INITIAL_BACKFILL_DAYS: 30
      STALZONE_CLIENT_ID: ${{ vars.STALZONE_CLIENT_ID }}
      STALZONE_CLIENT_SECRET: ${{ secrets.STALZONE_CLIENT_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Collect or resume region
        run: npm run collect -- "$MARKET_REGION"

  publish-prices-and-status:
    needs: [plan, collect]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build canonical prices from stable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run pricing:published

      - name: Record workflow activity
        env:
          MARKET_REGIONS: ${{ needs.plan.outputs.regions }}
          MARKET_RUN_RESULT: ${{ needs.collect.result }}
        run: node scripts/write-run-status.mjs status/last-run.json

      - name: Commit prices and operational status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pricing-index.json status/last-run.json
          git commit -m "pricing,status: publish refreshed market estimates (record update activity)"
          git push origin HEAD:main
