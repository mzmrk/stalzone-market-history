name: Update market history
run-name: Market history (${{ github.event_name == 'schedule' && 'all' || inputs.region }})

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      region:
        description: Region to update
        required: true
        type: choice
        options: [all, eu, ru, na, sea, nea]
        default: all

permissions:
  contents: write

concurrency:
  group: market-history-api
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.regions.outputs.regions }}
    steps:
      - name: Build selected-region matrix
        id: regions
        env:
          REGION_SELECTION: ${{ github.event_name == 'schedule' && 'all' || inputs.region }}
        run: |
          node -e '
            const fs = require("node:fs");
            const supported = ["eu", "ru", "na", "sea", "nea"];
            const selection = process.env.REGION_SELECTION;
            if (selection !== "all" && !supported.includes(selection)) {
              throw new Error(`Unsupported region selection: ${selection}`);
            }
            const regions = selection === "all" ? supported : [selection];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `regions=${JSON.stringify(regions)}\n`);
          '

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify collector
        run: npm test && npm run docs:check

  collect:
    needs: [plan, verify]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      MARKET_REGION: ${{ matrix.region }}
      MARKET_MAX_PAGES_PER_ARTIFACT: 3
      STALZONE_CLIENT_ID: ${{ vars.STALZONE_CLIENT_ID }}
      STALZONE_CLIENT_SECRET: ${{ secrets.STALZONE_CLIENT_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Collect or resume region
        run: npm run collect -- "$MARKET_REGION"
