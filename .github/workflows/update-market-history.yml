name: Update market history
run-name: Market history (${{ inputs.region || 'eu' }})

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      region:
        description: Region to update or resume
        required: true
        type: choice
        options: [eu, ru, na, sea, nea]
        default: eu

permissions:
  actions: write
  contents: write

concurrency:
  group: market-history-api
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      MARKET_REGION: ${{ inputs.region || 'eu' }}
      STALZONE_CLIENT_ID: ${{ vars.STALZONE_CLIENT_ID }}
      STALZONE_CLIENT_SECRET: ${{ secrets.STALZONE_CLIENT_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify collector
        run: npm test && npm run docs:check

      - name: Collect or resume region
        id: collect
        run: npm run collect -- "$MARKET_REGION"

      - name: Continue regional chain
        if: steps.collect.outputs.next_region != ''
        env:
          NEXT_REGION: ${{ steps.collect.outputs.next_region }}
        run: gh workflow run update-market-history.yml --ref main -f region="$NEXT_REGION"
